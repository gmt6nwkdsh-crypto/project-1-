<style>
/* Layout: one phone-width column; a Nutrition Facts label is the day's hero, meals below, bottom tab bar with a center log button. */
/* Single committed look: black with purple, same in every theme. */
:root{
  --bg:#07060a; --surface:#13101b; --ink:#efeaf7; --muted:#9c93ad; --line:#2a2338;
  --accent:#9b5cff; --accent-ink:#ffffff; --good:#4ade80; --hi:#efeaf7; --pro:#38c6d9; --carb:#f2b84b; --fat:#ff6fae; --warn:#ff7a59;
  --shade:rgba(0,0,0,.7);
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
.label{border-color:var(--accent)!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),0 10px 40px -12px color-mix(in srgb,var(--accent) 45%,transparent)}
.label .calrow .v{color:var(--hi,var(--ink))}
.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:600;font-size:13.5px}
.sw[aria-pressed="true"]{border:2px solid var(--accent);padding:9px}
.sw .dots i{width:14px;height:14px;margin-right:4px;display:inline-block;border-radius:50%}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.colors label{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px;cursor:pointer}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.brand{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:20px;letter-spacing:.01em}
.brand span{color:var(--accent)}
.who{font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.preview-t{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;padding:12px;border:1px solid var(--accent);border-radius:12px}
.preview-t div{display:flex;flex-direction:column}
.preview-t small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.preview-t b{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:24px}
.datenav{display:flex;align-items:center;gap:4px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.datelabel{min-width:118px;text-align:center;font-weight:600}

/* Nutrition facts label */
.label{background:var(--surface);border:2px solid var(--ink);padding:10px 12px 12px;font-family:var(--display)}
.label h2{margin:0;font-weight:900;font-stretch:72%;font-size:38px;line-height:1;letter-spacing:-.01em}
.label .sub{font-family:var(--body);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;padding:4px 0 6px;border-bottom:10px solid var(--ink)}
.label .calrow{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 0 4px;border-bottom:5px solid var(--ink)}
.label .calrow .k{font-weight:900;font-stretch:72%;font-size:26px}
.label .calrow .v{font-weight:900;font-stretch:72%;font-size:44px;line-height:1}
.label .dvhead{text-align:right;font-size:12px;font-weight:700;padding:3px 0;border-bottom:1px solid var(--ink)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--ink)}

.left{font-family:var(--body);font-size:13px;padding-top:7px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}

/* meals */

.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

.del:hover{background:var(--line)}
.addmeal{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font-weight:600;padding:10px 0}
.empty-note{color:var(--muted);font-size:13.5px;padding:4px 0 10px}
.dots{display:inline-flex;gap:8px;font-size:12px;color:var(--muted)}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}

.gear{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .2s}

.datenav{justify-content:center}
.ios-title{font-family:var(--display);font-weight:900;font-stretch:80%;font-size:34px;margin:4px 0 0;line-height:1.1}
.ios-head{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 -10px 14px}
.ios-group{background:var(--surface);border-radius:14px;overflow:hidden}
.ios-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0 0 0 14px;text-align:left;font-size:15.5px}
.ios-row .in{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 13px 0;border-bottom:1px solid var(--line);min-width:0}
.ios-group .ios-row:last-child .in{border-bottom:0}
.ios-row .val{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ios-row .chev{color:var(--muted);font-size:20px;line-height:1;margin-left:6px}
.ios-row:active{background:var(--line)}
.ios-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ios-back{border:0;background:none;color:var(--accent);font-weight:600;font-size:16px;padding:6px 0;display:flex;align-items:center;gap:4px;align-self:flex-start}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);background:var(--bg)}
.fab{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 18px;border-radius:999px;font-size:14px;white-space:nowrap}

/* panels */
.card{background:var(--surface);border-radius:14px;padding:14px}
.card h3{margin:0 0 10px;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=number],input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;width:100%}
textarea{resize:vertical;min-height:70px}
input,select,textarea{font-size:16px}
button,a,label,input,select,textarea,[role=button]{touch-action:manipulation}
.shade,.sheet{overscroll-behavior:contain}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:11px 16px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}
.wlist{display:flex;flex-direction:column}
.wlist .entry{grid-template-columns:1fr auto auto}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}

/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-family:var(--display);font-stretch:80%;font-weight:900;font-size:24px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:8px 2px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.drop b{font-family:var(--display);font-stretch:85%;font-size:19px;font-weight:800}
.drop span{color:var(--muted);font-size:13.5px}
.drop.has{padding:8px}
.preview{max-height:260px;border-radius:10px;object-fit:cover;width:100%}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.err{color:var(--warn);font-size:14px}
.ritem{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ritem .top{display:flex;gap:8px;align-items:center}
.ritem .top input{flex:1;min-width:0}
.ritem .mac{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.ritem .mac input{width:84px}
.ritem .mac b{color:var(--ink)}
.rsum{display:flex;justify-content:space-between;font-weight:700;padding:4px 2px}
.conf{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.recent{display:flex;flex-direction:column}
.recent button{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 2px}
.recent button small{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.storage{font-size:12.5px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.seg.two{grid-template-columns:1fr 1fr}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec .nm{min-width:0;display:flex;flex-direction:column}
.rec small{color:var(--muted);font-size:12.5px}
.rec .why{color:var(--ink);opacity:.8}
.btn.sm{padding:8px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.verdict{border-left:3px solid var(--accent);padding:8px 12px;background:var(--bg);border-radius:0 10px 10px 0;margin-top:12px}
.verdict.warn{border-left-color:var(--warn)}
.gsub{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.gacts{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}
.gacts .addmeal{border-top:0;flex:1;white-space:nowrap;width:auto;min-width:0}
.gacts .addmeal.copy{text-align:right;color:var(--muted);font-weight:500;flex:none}
[data-sec]{display:flex;flex-direction:column;gap:18px}
.editor .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));align-items:end;gap:8px}
.editor .field{min-width:0}
.editor .row.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.editor input,.editor select{padding:9px 8px}
.ibar .bar{grid-column:auto}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{display:block}
.stat span{display:block}
.stats{align-items:start}
.wfield-date{flex:1.4}
.entry .nm{cursor:pointer}
.dl-row .n{cursor:pointer}
.editor{border:1px solid var(--accent);border-radius:12px;padding:12px;margin:8px 0;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.editor .row{gap:8px}
.editor .field{min-width:70px}
.editor .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:var(--accent);font-weight:800;padding:0}
.savedmeal{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 2px}
.savedmeal small{color:var(--muted)}
.sec-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 2px}
.savebtn{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:10px 6px 10px 12px;margin:-10px -6px -10px 0}
.dl-ed{padding-left:70px}
.signin{border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.signin b{font-size:15.5px}
.signin p{margin:0;color:var(--muted);font-size:13.5px}
.signin .row a{text-decoration:none}
.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps li::marker{color:var(--accent);font-weight:800}
.acct{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
#timeSel{padding:8px 9px}
.sheet-h{flex-wrap:wrap}
#mealNames input{padding:9px 10px}
.dayline{padding:14px 14px 4px}
.dl-hist svg{width:100%;height:auto;display:block}
.dl-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;margin-top:12px}
.dl-stats div{padding:8px 10px;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line);min-width:0}
.dl-stats div:first-child{border-left:0}
.dl-stats small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dl-stats b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;font-weight:600;white-space:nowrap}
.dl-rail{margin-top:14px}
.dl-row,.dl-gap,.dl-blk,.dl-now{display:grid;grid-template-columns:48px 12px minmax(0,1fr) auto 34px;column-gap:10px;align-items:start}
.dl-row .t,.dl-gap .t,.dl-now .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--ink);padding-top:9px;text-align:right}
.dl-row .d,.dl-gap .d,.dl-blk .d,.dl-now .d{position:relative;align-self:stretch}
.dl-row .d::before,.dl-gap .d::before,.dl-blk .d::before,.dl-now .d::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.dl-gap .d::before{background:repeating-linear-gradient(var(--line) 0 3px,transparent 3px 6px)}
.dl-row .d::after{content:"";position:absolute;left:1px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.dl-now .d::after{content:"";position:absolute;left:1px;top:12px;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);box-sizing:border-box}
.dl-row .n{padding:7px 0;min-width:0}
.dl-row .n div{font-weight:600;overflow-wrap:anywhere}
.dl-row .n small{color:var(--muted);font-size:12.5px}
.dl-row .kc{padding-top:8px;font-weight:700}
.dl-row .del{margin-top:4px}
.dl-gap .n{grid-column:3/-1;font-size:12.5px;color:var(--muted);padding:2px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.dl-blk .n{grid-column:3/-1;padding:12px 0 2px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dl-blk .n em{font-style:normal;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.dl-blk .d::after{content:"";position:absolute;left:2px;top:14px;width:8px;height:8px;background:var(--surface);border:2px solid var(--accent);box-sizing:border-box;transform:rotate(45deg)}
.dl-now .n{grid-column:3/-1;padding-top:9px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.dayline .addmeal{margin-top:10px}
.ringsdash{display:flex;flex-direction:column;align-items:center;gap:10px}
.minirings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.minirings div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.minirings small{font-size:12.5px;font-weight:600}
.minirings small span{font-weight:400;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tile small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile b{font-family:var(--display);font-stretch:75%;font-weight:900;font-size:32px;line-height:1.05;color:var(--hi,var(--ink))}
.tile b span{font-size:18px;margin-left:2px}
.tile > span{font-size:12.5px;color:var(--muted)}
.habits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-weight:600;font-size:13.5px;text-align:left;min-width:0}
.hab.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.hab .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.hab.on .box{background:var(--good);border-color:var(--good);color:var(--bg)}
.hab.water{grid-column:1/-1;justify-content:space-between}
.hab.water small{display:block;color:var(--muted);font-weight:500}
.ctr{display:flex;gap:6px}
.ctr button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.ibars{display:flex;flex-direction:column;gap:8px}
.ibar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:13.5px}
.ibar .bar{height:8px}
.ibar span:last-child{text-align:right;color:var(--muted)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ai-out{white-space:pre-wrap;line-height:1.55;margin-top:10px}
.gated nav.tabs,.gated #datenav,.gated #gearBtn{display:none!important}
.gate{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.gate .ios-title{font-size:30px}
.gate form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.profiles{display:flex;flex-direction:column;gap:8px}
.prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:56px}
.prof span:last-child{display:flex;flex-direction:column;min-width:0}
.prof b{overflow-wrap:anywhere}
.prof small{color:var(--muted);font-size:13px}
.prof .avatar{width:36px;height:36px;font-size:15px}
.gate a{color:var(--accent);font-weight:600}
</style>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(+n || 0).toLocaleString();
const r1 = n => Math.round((+n || 0) * 10) / 10;
const z = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const todayKey = () => dkey(new Date());
const shortDate = k => parseKey(k).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const clone = o => JSON.parse(JSON.stringify(o));
const MEALS = [['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
const DEFAULT_TARGETS = { cal: 2000, p: 150, c: 200, f: 65 };

/* ---------- storage: this site's accounts (synced through /api) ---------- */
let cloud = false, who = '', me = null, isOwner = false, storeReady = false;
let LS = 'macrolens:';
const guest = null; // older builds had device-only guest profiles; accounts replaced them
async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
  } catch (e) {
    throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'offline', text: 'You look offline. Check your connection and try again.' };
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = { code: (j.error && j.error.code) || 'server', text: (j.error && j.error.message) || 'Something went wrong. Try again.', status: r.status };
    if (r.status === 401 && path.indexOf('/api/auth') !== 0) signedOut();
    throw err;
  }
  return j;
}
function useAccount(u) { me = u; who = u.name || u.username; cloud = true; LS = 'macrolens:u:' + u.username + ':'; }
async function initStore() {
  try { const j = await api('/api/auth'); if (j.user) useAccount(j.user); } catch (e) { initErr = e; }
}
let initErr = null, signedOutShown = false;
function signedOut() {
  if (signedOutShown) return; signedOutShown = true;
  toast('You were signed out. Sign in again to keep saving.');
  setTimeout(() => location.reload(), 1800);
}
async function getDoc(id) {
  try { const j = await api('/api/doc?id=' + encodeURIComponent(id)); return j.data ? clone(j.data) : null; }
  catch (e) { return null; }
}
const chains = {};
function saveDoc(id, obj) {
  const body = JSON.stringify(obj);
  chains[id] = (chains[id] || Promise.resolve()).then(async () => {
    let tries = 0;
    for (;;) {
      try { await api('/api/doc?id=' + encodeURIComponent(id), { method: 'PUT', body }); return; }
      catch (e) {
        if (e && (e.code === 'offline' || e.status >= 500) && tries++ < 2) { await new Promise(r => setTimeout(r, 1200 * tries)); continue; }
        throw e;
      }
    }
  }).catch(e => toast(e && e.code === 'too_large' ? 'This day is too big to save. Delete a few entries.' : e && e.code === 'offline' ? 'Couldn’t save: you look offline. Try again when you’re connected.' : 'Couldn’t save that change. Try again.'));
  return chains[id];
}
function renderWho() {
  const first = who ? who.split(' ')[0] : '';
  $('#who').innerHTML = cloud ? `Signed in as <b>${esc(first)}</b>` : '';
}
async function listDays(since) {
  try { const j = await api('/api/doc?days_since=' + encodeURIComponent(since)); return j.days || []; }
  catch (e) { return []; }
}

/* ---------- sign in / create account ---------- */
let gateDone = null;
async function accountGate() {
  document.body.classList.add('gated');
  return new Promise(res => { gateDone = res; renderGate('create'); });
}
function renderGate(tab, prefill) {
  const create = tab === 'create';
  const down = initErr && initErr.code === 'no_database';
  $('#view-today').innerHTML = `<div class="gate">
    <div><h1 class="ios-title">${create ? 'Welcome' : 'Welcome back'}</h1><p class="hint">Track calories and macros, snap a photo of your plate to log it, and watch your weight trend. Free, no email needed.</p></div>
    ${down ? `<div class="verdict warn"><b>The app isn’t finished setting up.</b><p class="hint" style="margin:4px 0 0">${esc(initErr.text)}</p></div>` : ''}
    <div class="card">
      <div class="seg two" role="group" aria-label="Sign in or create an account"><button type="button" data-gtab="create" aria-pressed="${create}">Create account</button><button type="button" data-gtab="signin" aria-pressed="${!create}">Sign in</button></div>
      <form id="gForm" novalidate>
        <div class="field"><label for="gUser">Username</label><input type="text" id="gUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="24" value="${esc(prefill || '')}" placeholder="${create ? 'Pick a username…' : 'Your username…'}"></div>
        <div class="field"><label for="gPass">Password</label><input type="password" id="gPass" name="password" autocomplete="${create ? 'new-password' : 'current-password'}" maxlength="200"></div>
        ${create ? `<div class="field"><label for="gPass2">Confirm password</label><input type="password" id="gPass2" name="password2" autocomplete="new-password" maxlength="200"></div>` : ''}
        <label class="check" for="gRem"><input type="checkbox" id="gRem" checked> Keep me signed in on this device</label>
        <p class="err" id="gErr" role="alert" style="margin:0"></p>
        <button class="btn" type="submit" id="gGo">${create ? 'Create account' : 'Sign in'}</button>
      </form>
      <p class="hint">${create ? 'Your log syncs to any phone or computer where you sign in. There’s no email, so a forgotten password can’t be reset: pick one you’ll remember.' : 'Forgot your password? There’s no email on accounts, so it can’t be reset. Ask the person who shared this app with you.'}</p>
    </div>
  </div>`;
  const v = $('#view-today');
  v.querySelectorAll('[data-gtab]').forEach(b => b.onclick = () => renderGate(b.dataset.gtab, $('#gUser').value));
  $('#gForm').onsubmit = async e => { e.preventDefault(); await submitGate(create); };
}
async function submitGate(create) {
  const err = m => { $('#gErr').textContent = m; };
  const name = $('#gUser').value.trim(), pw = $('#gPass').value, id = name.toLowerCase();
  if (create) {
    if (!/^[a-z0-9_.-]{3,24}$/.test(id)) return err('Usernames are 3–24 characters: letters, numbers, dots, dashes or underscores.');
    if (pw.length < 8) return err('Use a password with at least 8 characters.');
    if (pw !== $('#gPass2').value) return err('The two passwords don’t match.');
  } else if (!id || !pw) return err('Enter your username and password.');
  const go = $('#gGo'); go.disabled = true; go.textContent = create ? 'Creating…' : 'Signing in…';
  try {
    const j = await api('/api/auth', { method: 'POST', body: JSON.stringify({ action: create ? 'signup' : 'login', username: name, password: pw, remember: $('#gRem').checked }) });
    finishLogin(j.user);
  } catch (e) {
    go.disabled = false; go.textContent = create ? 'Create account' : 'Sign in';
    if (!create) $('#gPass').value = '';
    err(e.text || 'Something went wrong. Try again.');
  }
}
function finishLogin(u) {
  useAccount(u);
  document.body.classList.remove('gated');
  $('#view-today').innerHTML = '<div class="status"><div class="spin"></div>Loading your log…</div>';
  if (gateDone) { const d = gateDone; gateDone = null; d(); }
}
async function logOut() {
  try { await api('/api/auth', { method: 'POST', body: JSON.stringify({ action: 'logout' }) }); } catch (e) {}
  location.reload();
}

/* ---------- state ---------- */
const S = { date: todayKey(), day: null, settings: { kind: 'settings', targets: { ...DEFAULT_TARGETS }, recent: [] }, weights: { kind: 'weights', log: {} }, tab: 'today', loaded: false };
const blankDay = date => ({ kind: 'day', date, entries: [] });
async function loadDay(date) {
  S.date = date; S.day = null; S.editId = null; renderToday();
  const d = await getDoc('day-' + date);
  if (S.date !== date) return;
  S.day = d && Array.isArray(d.entries) ? d : blankDay(date);
  renderToday();
}
const totals = entries => entries.reduce((a, e) => ({ cal: a.cal + (+e.cal||0), p: a.p + (+e.p||0), c: a.c + (+e.c||0), f: a.f + (+e.f||0) }), { cal: 0, p: 0, c: 0, f: 0 });

/* ---------- toast ---------- */
let tt;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = '';
  const s = document.createElement('span'); s.textContent = msg; t.append(s);
  if (undo) { const b = document.createElement('button'); b.textContent = 'Undo'; b.onclick = () => { t.hidden = true; undo(); }; t.append(b); }
  const lv = $('#live'); if (lv) { lv.textContent = ''; setTimeout(() => { lv.textContent = msg; }, 50); }
  t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, undo ? 5000 : 2600);
}

/* ---------- Today ---------- */
function dateText(k) {
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t, -1)) return 'Yesterday';
  return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function renderToday() {
  $('#dateLabel').textContent = dateText(S.date);
  $('#nextDay').disabled = S.date >= todayKey();
  const v = $('#view-today');
  if (S.needsSetup) { v.innerHTML = setupHTML(true); wireSetup(true); return; }
  if (!S.day) { v.innerHTML = '<div class="status"><div class="spin"></div>Loading your log…</div>'; return; }
  const T = dayTargets(S.date, S.day), tot = totals(S.day.entries);
  const leftCal = T.cal - tot.cal;
  const row = (k, name, val, tgt, color) => {
    const pct = tgt ? Math.round(val / tgt * 100) : 0;
    return `<div class="mrow"><div><b>${name}</b> <span class="g num">${fmt(val)}g / ${fmt(tgt)}g</span></div><div class="pct num ${pct > 110 ? 'over' : ''}">${pct}%</div>
      <div class="bar"><i style="width:${Math.min(100, pct)}%;background:${barColor(pct, color)}"></i></div></div>`;
  };
  let html = (showSigninBanner() ? signInCard(true) : '') + (T.type ? `<div class="seg two" role="group" aria-label="Day type">
      <button data-dtype="train" aria-pressed="${T.type === 'train'}">Training day</button>
      <button data-dtype="rest" aria-pressed="${T.type === 'rest'}">Rest day</button></div>` : '');
  const dash = theme.dash || 'label';
  if (dash === 'rings') {
    html += `<div class="card ringsdash"><div class="bigring">${ringSVG(T.cal ? tot.cal / T.cal * 100 : 0, '--accent', 168, 14, fmt(tot.cal), `${leftCal < 0 ? fmt(-leftCal) + ' over' : fmt(leftCal) + ' left'}`)}</div>
      <div class="minirings">${[['Protein', tot.p, T.p, '--pro'], ['Carbs', tot.c, T.c, '--carb'], ['Fat', tot.f, T.f, '--fat']].map(([n, v2, t2, c]) => `<div>${ringSVG(t2 ? v2 / t2 * 100 : 0, c, 84, 8, fmt(v2) + 'g', '')}<small>${n}<br><span class="num">of ${fmt(t2)}g</span></small></div>`).join('')}</div>
      <p class="hint" style="text-align:center;margin:6px 0 0">${T.type ? (T.type === 'train' ? 'Training' : 'Rest') + ' day · ' : ''}Target ${fmt(T.cal)} Cal</p></div>`;
  } else if (dash === 'compact') {
    const tile = (n, v2, t2, c, u) => { const pct = t2 ? Math.round(v2 / t2 * 100) : 0; return `<div class="tile"><small>${n}</small><b class="num">${fmt(v2)}<span>${u}</span></b><span class="num">${fmt(Math.max(0, t2 - v2))}${u} left · ${pct}%</span><div class="bar"><i style="width:${Math.min(100, pct)}%;background:${barColor(pct, c)}"></i></div></div>`; };
    html += `<div class="tiles">${tile('Calories', tot.cal, T.cal, '--accent', '')}${tile('Protein', tot.p, T.p, '--pro', 'g')}${tile('Carbs', tot.c, T.c, '--carb', 'g')}${tile('Fat', tot.f, T.f, '--fat', 'g')}</div>`;
  } else html += `<div class="label" aria-label="Daily totals">
    <h2>Nutrition Facts</h2>
    <div class="sub"><span>${esc(dateText(S.date))} · ${S.day.entries.length} item${S.day.entries.length === 1 ? '' : 's'}</span><span class="num">${T.type ? (T.type === 'train' ? 'Training' : 'Rest') + ' day · ' : ''}Target ${fmt(T.cal)} Cal</span></div>
    <div class="calrow"><span class="k">Calories</span><span class="v num">${fmt(tot.cal)}</span></div>
    <div class="dvhead">% of target*</div>
    ${row('p', 'Protein', tot.p, T.p, '--pro')}
    ${row('c', 'Total Carbs', tot.c, T.c, '--carb')}
    ${row('f', 'Total Fat', tot.f, T.f, '--fat')}
    <div class="left"><span>* Change targets in Settings.</span><span class="${leftCal < 0 ? 'over' : ''}"><strong class="num ${leftCal < 0 ? 'over' : ''}">${fmt(Math.abs(leftCal))}</strong> Cal ${leftCal < 0 ? 'over' : 'left'}</span></div>
  </div>`;
  html += habitsHTML();
  html += recsHTML(T, tot);
  const L = logCfg(), groups = logGroups(L), showT = L.showTimes || L.mode === 'time' || L.mode === 'timeline';
  const sorted = [...S.day.entries].sort((a, b) => entryMin(a) - entryMin(b));
  const canCopy = L.copy && (L.mode === 'meals' || L.mode === 'custom');
  if (L.mode === 'time' || L.mode === 'timeline') html += daylineHTML(L, sorted);
  else groups.forEach((g, gi) => {
    const es = sorted.filter(e => g.match(e));
    const mt = totals(es);
    html += `<div class="meal"><div class="meal-h"><h3>${esc(g.name)}${g.sub ? ` <span class="gsub">${g.sub}</span>` : ''}</h3><span class="tot num">${es.length ? fmt(mt.cal) + ' Cal' : ''}${es.length >= 2 ? `<button class="savebtn" data-savemeal="${g.key}" aria-label="Save ${esc(g.name)} as a meal">Save</button>` : ''}</span></div>`;
    if (!es.length && gi === 0 && !S.day.entries.length) html += `<div class="empty-note">Nothing logged yet. Tap <b>+ Log food</b> and snap a photo of your plate — the AI estimates every item's calories and macros, and you can adjust before saving.</div>`;
    for (const e of es) {
      html += `<div class="entry"><div class="nm" data-edit="${esc(e.id)}" role="button" tabindex="0" aria-label="Edit ${esc(e.name)}"><div>${esc(e.name)}</div><small class="num">${showT ? fmtTime(entryMin(e)) + ' · ' : ''}${e.grams ? fmt(e.grams) + 'g · ' : ''}P ${fmt(e.p)} · C ${fmt(e.c)} · F ${fmt(e.f)}${e.src === 'photo' ? ' · from photo' : ''}</small></div>
        <span class="kc num">${fmt(e.cal)}</span><button class="del" data-del="${esc(e.id)}" aria-label="Delete ${esc(e.name)}">×</button></div>${S.editId === e.id ? editorHTML(e, L) : ''}`;
    }
    html += `<div class="gacts"><button class="addmeal" data-add="${g.key}">+ Add${L.mode === 'timeline' ? ' food' : ' to ' + esc(g.name.toLowerCase())}</button>${canCopy && !es.length ? `<button class="addmeal copy" data-copy="${g.key}">Copy from yesterday</button>` : ''}</div></div>`;
  });
  v.innerHTML = html;
  if ($('#recCtx')) $('#recCtx').value = S.recCtx || '';
}
/* ---------- edit an entry in place ---------- */
function editorHTML(e, L) {
  const timeMode = L.mode === 'time' || L.mode === 'timeline';
  const opts = L.mode === 'custom' ? L.names.map((n, i) => [`c${i}`, n]) : MEALS.map(([k, n]) => [k, n === 'Snacks' ? 'Snack' : n]);
  const cur = L.mode === 'custom' ? 'c' + customIdx(e.meal, L.names.length) : legacyMeal(e.meal);
  const tm = entryMin(e);
  return `<div class="editor" role="group" aria-label="Edit ${esc(e.name)}">
    <div class="field"><label for="edName">Food</label><input type="text" id="edName" value="${esc(e.name)}" maxlength="80"></div>
    <div class="row">

const TIME_BLOCKS = [['night', 'Night', 0, 5, '02:00'], ['morning', 'Morning', 5, 11, '08:00'], ['midday', 'Midday', 11, 15, '12:30'], ['afternoon', 'Afternoon', 15, 18, '16:00'], ['evening', 'Evening', 18, 24, '19:30']];

}
const fmtTime = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return logCfg().clock24 ? pad2(h) + ':' + pad2(mm) : (h % 12 || 12) + ':' + pad2(mm) + (h < 12 ? ' AM' : ' PM'); };
const fmtDur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60); return h ? h + 'h ' + pad2(m % 60) + 'm' : m + 'm'; };
/* precise 24-hour view: hourly intake strip, eating window, then a time rail with every entry at its exact time */
function daylineHTML(L, sorted) {
  const isToday = S.date === todayKey(), nowM = hmToMin(nowHM());
  const hours = Array(24).fill(0);
  sorted.forEach(e => { hours[Math.floor(entryMin(e) / 60) % 24] += +e.cal || 0; });
  const hmax = Math.max(100, ...hours);
  const W = 340, H = 78, pt = 4, pb = 18, bw = W / 24;
  let bars = '';
  hours.forEach((c, i) => {
    const h = c ? Math.max(3, c / hmax * (H - pt - pb)) : 0;
    bars += `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="var(--accent)"/>`;
  });

    const x = Math.min(W - .5, Math.max(.5, i * bw));

    if (i % 6 === 0) ticks += `<text x="${x}" y="${H - 3}" font-size="10" fill="var(--muted)" text-anchor="${i === 0 ? 'start' : i === 24 ? 'end' : 'middle'}" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">${pad2(i % 24 === 0 && i ? 24 : i)}:00</text>`;
  }

}
const blockOf = min => { const h = (((min % 1440) + 1440) % 1440) / 60; return (TIME_BLOCKS.find(b => h >= b[2] && h < b[3]) || TIME_BLOCKS[0])[0]; };

/* training / rest day targets: carbs shift so the weekly average stays on target */
function dayTargets(date, day) {
  const T = S.settings.targets, cy = S.settings.cycle;
  if (!cy || !cy.on || !Array.isArray(cy.days)) return { ...T, type: null };
  const n = cy.days.length;
  if (n === 0 || n === 7) return { ...T, type: null };
  const type = day && day.type ? day.type : (cy.days.includes(parseKey(date).getDay()) ? 'train' : 'rest');
  const d = type === 'train' ? cy.shift : -Math.round(cy.shift * n / (7 - n));
  return { cal: T.cal + d, p: T.p, c: Math.max(0, Math.round(T.c + d / 4)), f: T.f, type };
}

  const recentNames = (S.settings.recent || []).slice(0, 12).map(r => r.name).join(', ');

${S.recCtx ? 'Where they are eating / what is available: ' + S.recCtx : 'No location given: suggest common, cheap foods a college student can easily get.'}
${recentNames ? 'Foods they have logged recently (for taste, not required): ' + recentNames : ''}
Suggest 4 specific options (a single food or a simple combo) that each fit inside the remaining calories and prioritize hitting the protein that's left. If calories are already used up, suggest very low-calorie, high-protein options. Use realistic portions and accurate macros. Favor whole foods; no supplements other than protein powder.
Reply with ONLY JSON: {"items":[{"name":"Greek yogurt with berries","amount":"1 cup yogurt + 1/2 cup berries","calories":180,"protein":24,"carbs":18,"fat":1,"why":"one short reason it fits"}]}`;

function trendSeries(log) {
  const ds = Object.keys(log).filter(d => +log[d] > 0).sort();
  let t = null, prev = null;
  return ds.map(d => {
    const w = +log[d];
    if (t == null) t = w; else { const a = 1 - Math.pow(0.9, Math.max(1, dayNum(d) - dayNum(prev))); t = t + a * (w - t); }
    prev = d; return { date: d, w, t };
  });
}
const trendAt = (ser, date) => { let r = null; for (const p of ser) { if (p.date <= date) r = p.t; else break; } return r; };
function chartSVG(pts) {
  const W = 340, H = 160, pl = 34, pr = 8, pt = 10, pb = 22;
  const x0 = dayNum(pts[0].date), x1 = Math.max(x0 + 1, dayNum(pts[pts.length - 1].date));
  const vals = pts.flatMap(p => [p.w, p.t]);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const sx = d => pl + (dayNum(d) - x0) / (x1 - x0) * (W - pl - pr);
  const sy = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = sy(v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${r1(v)}</text>`;
  }
  const dots = pts.map(p => `<circle cx="${sx(p.date)}" cy="${sy(p.w)}" r="2.4" fill="var(--muted)" opacity=".6"/>`).join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + sx(p.date).toFixed(1) + ' ' + sy(p.t).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scale weight and trend line">${g}${dots}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(last.date)}" cy="${sy(last.t)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>
    <text x="${pl}" y="${H - 6}" font-size="10" fill="var(--muted)">${shortDate(pts[0].date)}</text>
    <text x="${W - pr}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${shortDate(last.date)}</text></svg>`;
}

async function estimateTDEE() {

  let sDate = start, tS = trendAt(ser, start);
  if (tS == null && win.length) { sDate = win[0].date; tS = win[0].t; }
  const tE = trendAt(ser, t), span = dayNum(t) - dayNum(sDate);
  if (days.length < 10 || win.length < 6 || tS == null || tE == null || span < 10) return { value: null, days: days.length, weighs: win.length };

/* ---------- Setup / target calculator ---------- */
function calcTargets(v) {
  const kg = v.lb * 0.4536, cm = (v.ft * 12 + v.inch) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * v.age + (v.sex === 'm' ? 5 : -161);
  const shred = v.goal === 'shred';
  // shred: aim for ~0.75% of body weight per week (500 Cal/day ≈ 1 lb/week), never past 1%
  const delta = shred ? -Math.min(0.0075 * v.lb * 500, 1000) : v.goal;
  const floor = v.sex === 'm' ? 1500 : 1200;
  const cal = Math.max(floor, Math.round((bmr * v.act + delta) / 10) * 10);
  const p = Math.round(v.lb * (shred ? 1.1 : v.goal < 0 ? 1 : 0.8));
  const f = Math.round(Math.max(0.3 * v.lb, cal * (shred ? 0.2 : 0.25) / 9));
  const c = Math.max(0, Math.round((cal - p * 4 - f * 9) / 4));
  return { cal, p, c, f };
}
const goalRate = v => v.goal === 'shred' ? -0.0075 * v.lb : (+v.goal || 0) * 7 / 3500;

const PRESETS = {
  ultraviolet: { name: 'Ultraviolet', accent: '#a855f7', hi: '', pro: '#a855f7', carb: '#c084fc', fat: '#e9d5ff' },
  champion: { name: 'Champion', accent: '#f5c451', hi: '#f5c451', pro: '#8b5cf6', carb: '#f5c451', fat: '#c4b5fd' },
  voltage: { name: 'Voltage', accent: '#8b5cf6', hi: '', pro: '#22d3ee', carb: '#fbbf24', fat: '#f472b6' },
  custom: { name: 'Custom', accent: '#9b5cff', hi: '', pro: '#38c6d9', carb: '#f2b84b', fat: '#ff6fae' }
};
const NEUTRAL = {
  dark: { bg: '#09080d', surface: '#15121d', ink: '#f1edf8', muted: '#9a93ad', line: '#2a2438', warn: '#ff7a59', good: '#4ade80', shade: 'rgba(0,0,0,.7)' },
  light: { bg: '#f5f3fa', surface: '#ffffff', ink: '#17131f', muted: '#645d76', line: '#e3deec', warn: '#c2410c', good: '#15803d', shade: 'rgba(20,14,30,.45)' }
};
const DEFAULT_THEME = { preset: 'voltage', mode: 'dark', glow: true, custom: { ...PRESETS.custom } };
const hexRgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return [155, 92, 255]; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const lum = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const darken = (h, k) => '#' + hexRgb(h).map(v => Math.round(v * (1 - k)).toString(16).padStart(2, '0')).join('');
// keep bright colors readable on a light background
const forLight = h => { let c = h, i = 0; while (lum(c) > 0.3 && i++ < 12) c = darken(c, 0.12); return c; };
let theme = { ...DEFAULT_THEME };
function themeMode() { return theme.mode === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme.mode; }
function applyTheme() {
  const mode = themeMode(), N = NEUTRAL[mode];
  const P = theme.preset === 'custom' ? { ...PRESETS.custom, ...(theme.custom || {}) } : PRESETS[theme.preset] || PRESETS.voltage;
  const fix = c => mode === 'light' ? forLight(c) : c;
  const accent = fix(P.accent);
  const vars = { '--bg': N.bg, '--surface': N.surface, '--ink': N.ink, '--muted': N.muted, '--line': N.line, '--warn': N.warn, '--good': N.good, '--shade': N.shade,
    '--accent': accent, '--accent-ink': lum(accent) > 0.4 ? '#14100a' : '#ffffff', '--pro': fix(P.pro), '--carb': fix(P.carb), '--fat': fix(P.fat), '--hi': P.hi ? fix(P.hi) : N.ink };
  const r = document.documentElement;
  for (const k in vars) r.style.setProperty(k, vars[k]);
  r.style.colorScheme = mode;
  try { let m = document.querySelector('meta[name="theme-color"]'); if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); } m.content = N.bg; } catch (e) {}
}
function setTheme(patch, save) {
  theme = { ...theme, ...patch };
  applyTheme();
  try { localStorage.setItem(LS + 'theme', JSON.stringify(theme)); } catch (e) {}
  if (save) { S.settings.theme = theme; saveDoc('settings', S.settings); }
  if (S.tab === 'today') renderToday();
}
try { const t0 = JSON.parse(localStorage.getItem(LS + 'theme')); if (t0) theme = { ...DEFAULT_THEME, ...t0 }; } catch (e) {}
applyTheme();
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (theme.mode === 'system') applyTheme(); }); } catch (e) {}
// Progress Glow: gray while far off, theme color as you close in, green when you hit it, warning when well over
function barColor(pct, color) {

  if (pct >= 50) return `var(${color})`;

}
